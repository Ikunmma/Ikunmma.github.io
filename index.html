<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>无言の小屋</title>
  <meta name="description" content="在谷底也要开花，在海底也要望月">
  <link rel="icon" href="/img/hh.jpg">
  <style>
    :root {
      color-scheme: dark;
      --text: #f8fbff;
      --muted: rgba(248, 251, 255, 0.72);
      --soft: rgba(248, 251, 255, 0.54);
      --line: rgba(255, 255, 255, 0.18);
      --panel: rgba(255, 255, 255, 0.08);
      --accent: #7dd3fc;
      --accent-warm: #f7c873;
      --accent-green: #8ee6b1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "KaiTi", "STKaiti", "楷体", "华文楷体", serif;
      background: #070b14;
      color: var(--text);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    .entry {
      position: relative;
      display: grid;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
    }

    .entry::before {
      position: absolute;
      inset: 0;
      z-index: -3;
      content: "";
      background:
        linear-gradient(90deg, rgba(7, 11, 20, 0.86), rgba(7, 11, 20, 0.44) 54%, rgba(7, 11, 20, 0.72)),
        linear-gradient(180deg, rgba(7, 11, 20, 0.18), rgba(7, 11, 20, 0.86)),
        url("/img/profile.jpg") center / cover no-repeat;
      transform: scale(1.02);
      animation: backgroundDrift 18s ease-in-out infinite alternate;
    }

    .entry::after {
      position: absolute;
      inset: 0;
      z-index: -2;
      content: "";
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 76px 76px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.72), transparent 78%);
      pointer-events: none;
      animation: gridFloat 16s linear infinite;
    }

    .stars {
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.72) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(125, 211, 252, 0.54) 0 1px, transparent 1.6px);
      background-position: 0 0, 42px 58px;
      background-size: 140px 140px, 210px 210px;
      opacity: 0.34;
      animation: starsMove 28s linear infinite;
      pointer-events: none;
    }

    .entry-shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(1160px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px clamp(18px, 4vw, 48px);
    }

    .topbar,
    .footbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--soft);
      font-size: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
    }

    .brand img {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 50%;
      object-fit: cover;
    }

    .topnav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .topnav a {
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .topnav a:hover {
      color: var(--text);
    }

    .hero {
      display: grid;
      align-items: center;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 320px);
      gap: clamp(34px, 5vw, 66px);
      padding: 62px 0 54px;
    }

    .hero-copy {
      max-width: 710px;
      animation: fadeRise 0.8s ease-out both;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(58px, 7.4vw, 94px);
      line-height: 1.08;
      letter-spacing: 0;
      text-shadow: 0 18px 54px rgba(0, 0, 0, 0.42);
      white-space: nowrap;
    }

    .subtitle {
      position: relative;
      max-width: 660px;
      margin: 24px 0 0;
      padding-left: 20px;
      color: rgba(248, 251, 255, 0.84);
      font-size: clamp(21px, 2.2vw, 28px);
      line-height: 1.75;
      text-shadow: 0 10px 34px rgba(0, 0, 0, 0.34);
    }

    .subtitle::before {
      position: absolute;
      top: 0.38em;
      bottom: 0.38em;
      left: 0;
      width: 3px;
      border-radius: 999px;
      content: "";
      background: linear-gradient(var(--accent), var(--accent-warm));
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 36px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: #04111c;
      background: var(--accent);
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 14px 34px rgba(125, 211, 252, 0.22);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #a7e6ff;
      box-shadow: 0 18px 40px rgba(125, 211, 252, 0.32);
    }

    .button.secondary {
      color: var(--text);
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .button.secondary:hover {
      border-color: rgba(255, 255, 255, 0.42);
      background: rgba(255, 255, 255, 0.14);
    }

    .side-panel {
      position: relative;
      padding: 8px 0 8px 30px;
      border-left: 1px solid rgba(255, 255, 255, 0.24);
      animation: fadeRise 0.8s ease-out 0.16s both, floatSide 5.8s ease-in-out 1s infinite;
    }

    .side-panel::before {
      position: absolute;
      top: 18px;
      left: -3px;
      width: 5px;
      height: 52px;
      border-radius: 999px;
      content: "";
      background: linear-gradient(var(--accent), var(--accent-warm));
      box-shadow: 0 0 24px rgba(125, 211, 252, 0.48);
    }

    .profile-head {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .profile-head img {
      width: 64px;
      height: 64px;
      border: 2px solid rgba(255, 255, 255, 0.74);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.32);
    }

    .profile-head h2 {
      margin: 0 0 4px;
      font-size: 25px;
      letter-spacing: 0;
    }

    .profile-head p,
    .side-quote {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .side-quote {
      margin-top: 24px;
      font-size: 19px;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .motto-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .pill {
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      color: rgba(248, 251, 255, 0.78);
      background: rgba(255, 255, 255, 0.07);
      font-size: 13px;
    }

    .quick-link {
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      color: rgba(248, 251, 255, 0.82);
      background: rgba(255, 255, 255, 0.07);
      font-size: 15px;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .quick-link:hover {
      transform: translateY(-2px);
      border-color: rgba(125, 211, 252, 0.6);
      background: rgba(125, 211, 252, 0.12);
    }

    .pill:nth-child(2) {
      color: var(--accent-warm);
    }

    .pill:nth-child(3) {
      color: var(--accent-green);
    }

    .footbar {
      padding-top: 10px;
    }

    .scroll-hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .scroll-hint::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      content: "";
      background: var(--accent-green);
      box-shadow: 0 0 18px var(--accent-green);
      animation: breathe 1.8s ease-in-out infinite;
    }

    @keyframes backgroundDrift {
      from {
        transform: scale(1.02) translate3d(0, 0, 0);
      }
      to {
        transform: scale(1.07) translate3d(-12px, -8px, 0);
      }
    }

    @keyframes gridFloat {
      from {
        background-position: 0 0, 0 0;
      }
      to {
        background-position: 76px 76px, 76px 76px;
      }
    }

    @keyframes starsMove {
      from {
        background-position: 0 0, 42px 58px;
      }
      to {
        background-position: 140px -140px, 252px -152px;
      }
    }

    @keyframes fadeRise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floatSide {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes breathe {
      0%,
      100% {
        opacity: 0.65;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.45);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 840px) {
      .entry-shell {
        min-height: 100svh;
      }

      .topbar {
        align-items: flex-start;
      }

      .topnav {
        gap: 12px;
        font-size: 13px;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 44px 0 34px;
      }

      .side-panel {
        max-width: 520px;
        padding: 20px 0 0;
        border-top: 1px solid rgba(255, 255, 255, 0.22);
        border-left: 0;
      }

      .side-panel::before {
        top: -3px;
        left: 0;
        width: 52px;
        height: 5px;
      }
    }

    @media (max-width: 560px) {
      .entry-shell {
        padding: 20px 18px;
      }

      .topbar,
      .footbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .topnav {
        width: 100%;
        justify-content: space-between;
      }

      h1 {
        font-size: clamp(44px, 13vw, 66px);
      }

      .subtitle {
        padding-left: 16px;
        font-size: 20px;
      }

      .actions {
        display: grid;
      }

      .button {
        width: 100%;
      }

      .profile-head h2 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <main class="entry">
    <div class="stars" aria-hidden="true"></div>
    <div class="entry-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="无言の小屋">
          <img src="https://raw.githubusercontent.com/zkk1233/Picture/main/20250715114957806.jpg" alt="">
          <span>Hackun's Blog</span>
        </a>
        <nav class="topnav" aria-label="快速导航">
          <a href="/home/">博客</a>
          <a href="/archives/">归档</a>
          <a href="/friends/">友链</a>
        </nav>
      </header>

      <section class="hero" aria-label="进入无言の小屋">
        <div class="hero-copy">
          <h1>无言の小屋</h1>
          <p class="subtitle">在谷底也要开花，在海底也要望月</p>
          <div class="actions">
            <a class="button" href="/home/">进入博客</a>
            <a class="button secondary" href="/profile/">关于站长</a>
          </div>
          <div class="motto-row" aria-label="内容标签">
            <span class="pill">Web Security</span>
            <span class="pill">Programming</span>
            <span class="pill">Life Notes</span>
          </div>
        </div>

        <aside class="side-panel" aria-label="站点简介">
          <div class="profile-head">
            <img src="https://raw.githubusercontent.com/zkk1233/Picture/main/20250715114957806.jpg" alt="Hackun">
            <div>
              <h2>Hackun</h2>
              <p>随手记，慢慢写</p>
            </div>
          </div>
          <p class="side-quote">把踩过的坑、想明白的知识点，和偶尔出现的好心情都留在这里。</p>
          <div class="quick-links">
            <a class="quick-link" href="/home/">最新文章</a>
            <a class="quick-link" href="/categories/">文章分类</a>
            <a class="quick-link" href="/profile/">关于我</a>
          </div>
        </aside>
      </section>

      <footer class="footbar">
        <span>欢迎来到无言の小屋</span>
        <span class="scroll-hint">入口已就绪</span>
      </footer>
    </div>
  </main>
</body>
</html>
