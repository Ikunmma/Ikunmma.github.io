<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>无言の小屋</title>
  <meta name="description" content="在谷底也要开花，在海底也要望月">
  <link rel="icon" href="/img/hh.jpg">
  <style>
    :root {
      color-scheme: dark;
      --text: #f8fbff;
      --muted: rgba(248, 251, 255, 0.72);
      --soft: rgba(248, 251, 255, 0.54);
      --line: rgba(255, 255, 255, 0.18);
      --panel: rgba(9, 14, 26, 0.48);
      --panel-strong: rgba(9, 14, 26, 0.72);
      --accent: #7dd3fc;
      --accent-warm: #f7c873;
      --accent-green: #8ee6b1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "KaiTi", "STKaiti", "楷体", "华文楷体", serif;
      background: #070b14;
      color: var(--text);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    .entry {
      position: relative;
      display: grid;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
    }

    .entry::before {
      position: absolute;
      inset: 0;
      z-index: -3;
      content: "";
      background:
        linear-gradient(90deg, rgba(7, 11, 20, 0.86), rgba(7, 11, 20, 0.44) 54%, rgba(7, 11, 20, 0.72)),
        linear-gradient(180deg, rgba(7, 11, 20, 0.18), rgba(7, 11, 20, 0.86)),
        url("/img/profile.jpg") center / cover no-repeat;
      transform: scale(1.02);
    }

    .entry::after {
      position: absolute;
      inset: 0;
      z-index: -2;
      content: "";
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 76px 76px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.72), transparent 78%);
      pointer-events: none;
    }

    .entry-shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(1160px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px clamp(18px, 4vw, 48px);
    }

    .topbar,
    .footbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--soft);
      font-size: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
    }

    .brand img {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 50%;
      object-fit: cover;
    }

    .topnav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .topnav a {
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .topnav a:hover {
      color: var(--text);
    }

    .hero {
      display: grid;
      align-items: center;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 390px);
      gap: clamp(32px, 6vw, 78px);
      padding: 62px 0 54px;
    }

    .hero-copy {
      max-width: 710px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
    }

    .eyebrow::before {
      width: 28px;
      height: 2px;
      content: "";
      background: currentColor;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(52px, 8vw, 98px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 590px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.9;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 36px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: #04111c;
      background: var(--accent);
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 14px 34px rgba(125, 211, 252, 0.22);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #a7e6ff;
    }

    .button.secondary {
      color: var(--text);
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .button.secondary:hover {
      border-color: rgba(255, 255, 255, 0.42);
      background: rgba(255, 255, 255, 0.14);
    }

    .side-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 28px 86px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
    }

    .profile-card {
      padding: 26px;
    }

    .profile-card img {
      width: 86px;
      height: 86px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-card h2 {
      margin: 20px 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }

    .profile-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
    }

    .quick-links {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    .quick-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.11);
      color: var(--text);
      text-decoration: none;
    }

    .quick-link span {
      color: var(--soft);
      font-size: 13px;
    }

    .quick-link strong {
      font-size: 15px;
    }

    .quick-link i {
      flex: 0 0 auto;
      width: 9px;
      height: 9px;
      border-top: 2px solid currentColor;
      border-right: 2px solid currentColor;
      transform: rotate(45deg);
    }

    .motto-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .pill {
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      color: rgba(248, 251, 255, 0.78);
      background: rgba(255, 255, 255, 0.07);
      font-size: 13px;
    }

    .pill:nth-child(2) {
      color: var(--accent-warm);
    }

    .pill:nth-child(3) {
      color: var(--accent-green);
    }

    .footbar {
      padding-top: 10px;
    }

    .scroll-hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .scroll-hint::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      content: "";
      background: var(--accent-green);
      box-shadow: 0 0 18px var(--accent-green);
    }

    @media (max-width: 840px) {
      .entry-shell {
        min-height: 100svh;
      }

      .topbar {
        align-items: flex-start;
      }

      .topnav {
        gap: 12px;
        font-size: 13px;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 44px 0 34px;
      }

      .side-panel {
        max-width: 520px;
      }
    }

    @media (max-width: 560px) {
      .entry-shell {
        padding: 20px 18px;
      }

      .topbar,
      .footbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .topnav {
        width: 100%;
        justify-content: space-between;
      }

      h1 {
        font-size: clamp(46px, 16vw, 68px);
      }

      .actions {
        display: grid;
      }

      .button {
        width: 100%;
      }

      .profile-card {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="entry">
    <div class="entry-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="无言の小屋">
          <img src="https://raw.githubusercontent.com/zkk1233/Picture/main/20250715114957806.jpg" alt="">
          <span>Hackun's Blog</span>
        </a>
        <nav class="topnav" aria-label="快速导航">
          <a href="/home/">博客</a>
          <a href="/archives/">归档</a>
          <a href="/friends/">友链</a>
        </nav>
      </header>

      <section class="hero" aria-label="进入无言の小屋">
        <div class="hero-copy">
          <p class="eyebrow">Welcome to my space</p>
          <h1>无言の小屋</h1>
          <p class="subtitle">在谷底也要开花，在海底也要望月。这里记录网络安全、编程学习和生活里的那些灵光一闪。</p>
          <div class="actions">
            <a class="button" href="/home/">进入博客</a>
            <a class="button secondary" href="/profile/">关于站长</a>
          </div>
          <div class="motto-row" aria-label="内容标签">
            <span class="pill">Web Security</span>
            <span class="pill">Programming</span>
            <span class="pill">Life Notes</span>
          </div>
        </div>

        <aside class="side-panel profile-card" aria-label="站点简介">
          <img src="https://raw.githubusercontent.com/zkk1233/Picture/main/20250715114957806.jpg" alt="Hackun">
          <h2>Hackun</h2>
          <p>把踩过的坑、想明白的知识点和偶尔出现的好心情都认真留下来。</p>
          <div class="quick-links">
            <a class="quick-link" href="/home/">
              <span><strong>最新文章</strong><br>从这里开始阅读</span>
              <i aria-hidden="true"></i>
            </a>
            <a class="quick-link" href="/categories/">
              <span><strong>文章分类</strong><br>按主题继续探索</span>
              <i aria-hidden="true"></i>
            </a>
            <a class="quick-link" href="/profile/">
              <span><strong>关于我</strong><br>认识这个小屋的主人</span>
              <i aria-hidden="true"></i>
            </a>
          </div>
        </aside>
      </section>

      <footer class="footbar">
        <span>Welcome, traveler.</span>
        <span class="scroll-hint">Root page ready</span>
      </footer>
    </div>
  </main>
</body>
</html>
